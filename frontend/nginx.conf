    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name next.short-news.ru;

    ssl_certificate /etc/letsencrypt/live/short-news.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/short-news.ru/privkey.pem;

    location /api/ai/ {
        proxy_pass http://backend:3001/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend-next:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

